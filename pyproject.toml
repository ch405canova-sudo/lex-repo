[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lex"
version = "0.1.0"
description = "Terminal AI agent for Linux — coded for a local LLM via llama.cpp"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
    "numpy>=2.2.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
chatcli = "chatcli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "radon>=6.0.1",
    "vulture>=2.16",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests/", "\\.venv/"]
ignore_missing_imports = true

[tool.pylint]
py-version = 3.12
ignore-paths = ["tests/", ".venv/"]
disable = [
    "missing-module-docstring",
    "too-many-arguments",
    "too-many-instance-attributes",
    "duplicate-code",
    "cyclic-import",
    "too-many-return-statements",
]

[tool.pylint."FORMAT"]
max-line-length = 100

[tool.pylint."DESIGN"]
max-attributes = 20
max-locals = 30
max-returns = 6
max-branches = 20
max-statements = 80

[tool.vulture]
paths = ["src/chatcli"]
min_confidence = 80
exclude = ["tests/", ".venv/"]
